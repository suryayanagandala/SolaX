<h3 mat-dialog-title>Raise a Maintenance Request</h3>

<mat-dialog-content>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Reason</mat-label>

    <textarea
      matInput [(ngModel)]="description" #desc="ngModel" name="description" required minlength="10"
      (blur)="trimInput()">
    </textarea>

    <!-- ERROR MESSAGES -->
   <mat-error *ngIf="desc.invalid && desc.touched">

  <mat-error *ngIf="desc.hasError('required')">
  Reason is required
</mat-error>

<mat-error *ngIf="desc.hasError('minlength')">
  Minimum 10 characters required
</mat-error>

</mat-error>

  </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="warn" (click)="close()">
    Cancel
  </button>

  <button mat-raised-button color="primary" [disabled]="!isValidReason()" (click)="submit()">
    Submit
  </button>
</mat-dialog-actions>
