<div class="container">
  <mat-card class="reset-card">
    <form [formGroup]="resetForm" (ngSubmit)="resetPassword()">

      <mat-card-header class="card-header">
        <h2>Reset Password</h2>
      </mat-card-header>

      <mat-card-content class="card-content">

        <mat-form-field>
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="newPassword" [type]="hidePassword ? 'password' : 'text'">
          <button mat-icon-button matSuffix type="button" (click)="togglePassword()">
            <mat-icon>
              {{ hidePassword ? 'visibility_off' : 'visibility' }}
            </mat-icon>
          </button>

          <mat-icon matSuffix color="primary"
            *ngIf="resetForm.get('newPassword')?.valid && resetForm.get('newPassword')?.dirty">
            check_circle
          </mat-icon>

          <mat-error *ngIf="resetForm.get('newPassword')?.hasError('required')">
            Password is required
          </mat-error>

          <mat-error *ngIf="resetForm.get('newPassword')?.hasError('pattern')">
            Password does not meet requirements
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Re-enter Password</mat-label>
          <input matInput type="password" formControlName="confirmPassword" [type]="hidePassword ? 'password' : 'text'">
           <button mat-icon-button matSuffix type="button" (click)="togglePassword()">
            <mat-icon>
              {{ hidePassword ? 'visibility_off' : 'visibility' }}
            </mat-icon>
          </button>
          <mat-error *ngIf="
          resetForm.get('confirmPassword')?.value &&
          resetForm.get('confirmPassword')?.value !== resetForm.get('newPassword')?.value">
            Passwords do not match
          </mat-error>
        </mat-form-field>

      </mat-card-content>

      <mat-card-actions class="card-actions">
        <button mat-raised-button color="primary" type="submit" [disabled]="resetForm.invalid">
          Reset Password
        </button>

        <button mat-stroked-button color="accent" type="reset">
          Clear
        </button>
      </mat-card-actions>

    </form>
  </mat-card>
</div>
