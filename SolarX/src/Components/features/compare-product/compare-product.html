<h4 mat-dialog-title>
    <mat-icon>compare</mat-icon>
    AI Comparison
</h4>
<mat-dialog-content>
    <table>
        <tr>
            <th>Feature</th>
            <th>{{data.items[0]?.productName}}</th>
            <th>{{data.items[1]?.productName}}</th>
        </tr>

        <tr>
            <td>Price</td>
            <td>{{data.items[0]?.price}}</td>
            <td>{{data.items[1]?.price}}</td>
        </tr>

        <tr>
            <td>Capacity</td>
            <td>{{data.items[0]?.capacity}}</td>
            <td>{{data.items[1]?.capacity}}</td>
        </tr>
    </table>
    <div class="ai-result">
    <mat-icon>smart_toy</mat-icon> {{ displayedText }}<span *ngIf="isTyping">|</span>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button color="warn" (click)="close()">Close</button>
</mat-dialog-actions>
