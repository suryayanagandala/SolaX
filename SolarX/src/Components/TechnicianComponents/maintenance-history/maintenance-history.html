
    <div class="container">
      <p class="display-6">Maintenance History</p>
   <div *ngIf="dto.length>=1;else NodataFound">
      <table class="table table-bordered table-striped table-hover table-danger">
         <thead class="align-middle text-center">
            <tr>
                <th>RequestId</th>
                <th>Completed Date</th>
                <th>Address</th>
                <th>Status</th>
            </tr>
         </thead>
         <tbody>
            <tr *ngFor="let item of paginatedCompletedMaintenances">
                <td>{{item.requestId}}</td>
                <td>{{item.completeDate|date:'short'}}</td>
                <td>{{item.address}}</td>
                <td class="text-success fw-bold">{{item.status}}</td>
            </tr>
         </tbody>
      </table>
      <mat-paginator [length]="dto.length" [pageIndex]="pageIndex" [pageSize]="pageSize"
      [pageSizeOptions]="[5,10,20]" (page)="onPageEvent($event)" >

      </mat-paginator>
   </div>
   <ng-template #NodataFound>
         <div class="image-content">
            <img src="Assets/Themes/NoFounf.jpg" alt="" class="rounded-circle">
         </div>
   </ng-template>
</div>
