<div class="d-flex justify-content-center mt-5" *ngIf="isLoading">
   <mat-spinner diameter="50"></mat-spinner>
</div>

<div class="container mt-4" *ngIf="dashboard &&!isLoading">
   <div class="content">
      <mat-card class="mat-card" *ngFor="let card of dashboardCards; let i=index" [hidden]="!isCardVisible(card)"
         [style.backgroundColor]="bgColors[i % bgColors.length]">
         <mat-card-content>
            <div class="card-content">

               <mat-icon [color]="card.color">{{card.icon}}</mat-icon>
               <div>
                  <h4>{{dashboard[card.valueKey]}}</h4>
                  <p class="h4 fw-bold">{{card.label}}</p>
               </div>
            </div>
         </mat-card-content>
      </mat-card>
   </div>
</div>
<div class=" shadow p-4">



   <div class="row">


      <div class="col-md-6">
         <h4>Work Stats</h4>

         <div class="row">

            <div class="col-md-6 text-center">
               <apx-chart *ngIf="chartOptions" [series]="chartOptions.series" [chart]="chartOptions.chart"
                  [labels]="chartOptions.labels" [colors]="chartOptions.colors" [legend]="chartOptions.legend"
                  [responsive]="chartOptions.responsive">
               </apx-chart>
            </div>


            <div class="col-md-6">

               <div class="status-item mb-3">
                  <span class="badge bg-danger me-2"></span>
                  Assigned Jobs
                  <span style="padding-left: 41px;">{{assigned}}</span>
               </div>

               <div class="status-item mb-3">
                  <span class="badge bg-warning me-2"></span>
                  Pending Jobs
                  <span class="ms-5">{{pending}}</span>
               </div>

               <div class="status-item mb-3">
                  <span class="badge bg-success me-2"></span>
                  Completed Jobs
                  <span style="padding-left: 30px;">{{completed}}</span>
               </div>

            </div>

         </div>

      </div>

      <div class="col-md-6">
         <h3 class="text-center mb-3">
            Monthly Completed Jobs
         </h3>

         <apx-chart *ngIf="monthlyOptions" [series]="monthlyOptions.series" [chart]="monthlyOptions.chart"
            [xaxis]="monthlyOptions.xaxis" [title]="monthlyOptions.title" [colors]="monthlyOptions.colors"
            [theme]="monthlyOptions.theme">
         </apx-chart>
      </div>

   </div>

</div>

<div>
   <div class="row">
      <div class="col-md-6">
         <h5>Monthly Revenue</h5>
         <apx-chart *ngIf="monthlyRevenue" [series]="monthlyRevenue.series" [chart]="monthlyRevenue.chart"
            [xaxis]="monthlyRevenue.xaxis" [stroke]="monthlyRevenue.stroke" [colors]="monthlyRevenue.colors"
            [theme]="monthlyRevenue.theme" [fill]="monthlyRevenue.fill" [title]="monthlyRevenue.title">
         </apx-chart>
      </div>
      <div class="col-md-6">
         <h3 class="text-center mb-3">
            Technician Efficiency
         </h3>

         <apx-chart *ngIf="efficiencyOptions" [series]="efficiencyOptions.series" [chart]="efficiencyOptions.chart"
            [plotOptions]="efficiencyOptions.plotOptions" [colors]="efficiencyOptions.colors"
            [labels]="efficiencyOptions.labels" [theme]="efficiencyOptions.theme">
         </apx-chart>

         <div class="text-center mt-3">

            <p>
               <strong>Completed Jobs:</strong> {{completedJobs}}
            </p>

            <p>
               <strong>Total Jobs:</strong> {{totalJobs}}
            </p>

         </div>
      </div>

   </div>
</div>
