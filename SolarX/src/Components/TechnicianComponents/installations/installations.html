<div class="container mt-3">

   <div class="mt-3 text-center" *ngIf="installationDto.length > 0; else NodataFound">


      <table class="table table-bordered table-hover table-striped text-center">

         <thead class="table-dark text-white">
            <tr class="align-middle">
               <th>OrderId</th>
               <th>Installation Id</th>
               <th>Status</th>
               <th>Actions</th>
            </tr>
         </thead>

         <tbody>
            <tr class="align-middle" *ngFor="let i of paginatedInstallations">
               <td>{{ i.orderId }}</td>
               <td>{{ i.installationId }}</td>
               <td>
                  <span class="badge px-3 py-2" [ngClass]="{
          'bg-secondary': i.installationStatus === 'Assigned',
          'bg-warning text-dark': i.installationStatus === 'InProgress',
          'bg-success': i.installationStatus === 'Completed',
          'bg-danger': i.installationStatus === 'Cancelled'
        }">

                     <i class="me-1" [ngClass]="{
         'bi bi-person-check': i.installationStatus === 'Assigned',
         'bi bi-tools': i.installationStatus === 'InProgress',
         'bi bi-check-circle-fill': i.installationStatus === 'Completed',
         'bi bi-x-circle-fill': i.installationStatus === 'Cancelled'
       }">
                     </i>

                     {{ i.installationStatus }}
                  </span>
               </td>
               <td>
                  <button class="btn btn-sm" [ngClass]="{
          'btn-primary': i.installationStatus === 'Assigned',
          'btn-warning': i.installationStatus === 'InProgress',
          'btn-success': i.installationStatus === 'Completed',
          'btn-secondary': i.installationStatus === 'Cancelled'
        }" (click)="UpdatedInstallationStatus(i)">

                     <i class="bi me-1" [ngClass]="{
       'bi-play-circle': i.installationStatus === 'Assigned',
       'bi-arrow-repeat': i.installationStatus === 'InProgress',
       'bi-check-circle': i.installationStatus === 'Completed'
     }">
                     </i>

                     {{ i.actions }}
                  </button>
               </td>
            </tr>
         </tbody>

      </table>


      <div class="mt-2">
         <mat-paginator class="text-center" [pageIndex]="pageIndex" [length]="installationDto.length"
            [pageSize]="pageSize" [pageSizeOptions]="[5,10,20,30]" (page)="onPageEvent($event)" showFirstLastButtons>
         </mat-paginator>
      </div>

   </div>


   <ng-template #NodataFound>
      <div class="img-content text-center">
         <img src="Assets/Themes/NoFounf.jpg" class="rounded-circle">
         <br>
         <strong class="text">You don't have installations</strong>
      </div>
   </ng-template>

</div>
