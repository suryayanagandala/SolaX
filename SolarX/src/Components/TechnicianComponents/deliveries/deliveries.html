<div class="main vh-100">
    <div class="container">
    <div class="mt-3" *ngIf="deliveryDto.length;else empty">
        <table class="table table-bordered text-center table-hover table-striped">
            <thead class="table-primary">
                <tr class="align-middle">
                    <th>OrderId</th>
                    <th>CustomerName</th>
                    <th>DeliveryAddress</th>
                    <th>Phone Number</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let d of paginatedDeleveries" class="align-middle">
                    <td>{{d.orderId}}</td>
                    <td>{{d.customerName}}</td>
                    <td>{{d.delievryAddress}}</td>
                    <td>{{d.phoneNumber}}</td>
                    <td>
                       <span class="badge px-3 py-2" 
                       [ngClass]="{ 'bg-secondary': d.status === 'Assigned', 
                       'bg-warning text-dark': d.status === 'OutForDelivery', 
                       'bg-success': d.status === 'Delivered', 
                       'bg-danger': d.status === 'Cancelled' }"> 
                       <i class="me-1" [ngClass]="{ 'bi bi-person-check': d.status === 'Assigned', 
                       'bi bi-truck': d.status === 'OutForDelivery', 
                       'bi bi-check-circle-fill': d.status === 'Delivered', 
                       'bi bi-x-circle-fill': d.status === 'Cancelled' }"> 
                       </i> {{ d.status }}
                       </span>
                    </td>
                </tr>
            </tbody>
        </table>

        <mat-paginator [length]="deliveryDto.length" [pageIndex]="pageIndex" [pageSize]="pageSize" [pageSizeOptions]="[5,10,15]"
        showFirstLastButtons (page)="onPageEvent($event)">

        </mat-paginator>

    </div>

    <ng-template #empty>
        <div class="img-content">
           <img src="Assets/Themes/NoFounf.jpg" alt="" class="rounded-circle">
           <br>
           <strong class="mt-3">You don't have any delieveries </strong>
        </div>
    </ng-template>
</div>
</div>
