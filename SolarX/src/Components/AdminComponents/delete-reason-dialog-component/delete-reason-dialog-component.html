<h4 mat-dailog-title>Delete Product</h4>

<mat-dialog-content>
    <mat-form-field>
        <mat-label>Reason</mat-label>
          <textarea matInput  rows="3" [(ngModel)]="reason" required></textarea>
    </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions >
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="warn" (click)="submit()">
    Delete
  </button>
</mat-dialog-actions>
