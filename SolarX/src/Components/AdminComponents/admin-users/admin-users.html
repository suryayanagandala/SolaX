<mat-form-field appearance="outline" class="w-100">
  <mat-label>Search users</mat-label>
  <input matInput [formControl]="searchControl" placeholder="Name, Email, " style="color: white;">
</mat-form-field>

<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

  <!-- Name -->
  <ng-container matColumnDef="fullName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>
      Name
    </th>
    <td mat-cell *matCellDef="let user">
      {{ user.name }}
    </td>
  </ng-container>

  <!-- Email -->
  <ng-container matColumnDef="emailId">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>
      Email
    </th>
    <td mat-cell *matCellDef="let user">
      {{ user.email}}
    </td>
  </ng-container>

  <!-- Created Date -->
  <ng-container matColumnDef="phoneNumber">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>
      Phone Number
    </th>
    <td mat-cell *matCellDef="let user">
      {{ user.phoneNumber}}
    </td>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="roleName">
    <th mat-header-cell *matHeaderCellDef>
      RoleName
    </th>
    <td mat-cell *matCellDef="let user">
      {{user.roleName}}
    </td>
  </ng-container>


  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>
      Actions
    </th>
    <td mat-cell *matCellDef="let user" >
      <button mat-icon-button color="primary" *ngIf="user.actionStatus" routerLink="/admin/assign-technician"
       [queryParams]="{userId:user.userId}">
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>



  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [pageSizeOptions]="[5, 10, 25, 50]" showFirstLastButtons></mat-paginator>
