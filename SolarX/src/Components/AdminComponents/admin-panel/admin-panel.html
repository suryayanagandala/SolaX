
<mat-toolbar class="top-toolbar">

  <!-- Menu -->
  <button mat-icon-button (click)="drawer.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <div class="img-content">
     <img src="Assets/Themes/logo.jpg" routerLink="" alt="">
  </div>
  <span class="title" routerLink="">SolarX Ecommerce System</span>

  <span class="spacer"></span>

  <!-- Notifications -->
    <div class="notification-wrapper">

          <button mat-icon-button (click)="toggleNotification($event)">
            <mat-icon [matBadge]="notificationCount" matBadgeColor="warn" [matBadgeHidden]="notificationCount === 0">
              notifications
            </mat-icon>
          </button>

          <div class="notification-dropdown" *ngIf="isDropdownOpen" (click)="$event.stopPropagation()">

            <div class="empty" *ngIf="notification.length === 0">
              <h4 class="text-center fw-bold ms-2 fs-5">No Notifications</h4>
            </div>

            <div class="notification-item" *ngFor="let item of recentNotifications" (click)="openNotification(item)">

              <div class="notification-header">
                <span class="type">{{item.notificationType}}</span>
                <small>{{item.createdAt | date:'short'}}</small>
              </div>

              <p class="message">{{item.message}}</p>

            </div>

            <button class="see-more text-center" *ngIf="notification.length > 3" (click)="goToNotifications()">
              See All Notifications...
            </button>

          </div>

        </div>

  <!-- Theme Toggle -->
  <button mat-icon-button (click)="toggleTheme()">
    <mat-icon>
      {{ isDark ? 'light_mode' : 'dark_mode' }}
    </mat-icon>
  </button>

  <!-- Profile -->
  <button mat-button [matMenuTriggerFor]="profileMenu">
    <img src="Assets/Themes/profile.jpg" class="profile-pic">
    <!-- <span class="username">Admin</span> -->
    <mat-icon>arrow_drop_down</mat-icon>
  </button>

  <mat-menu #profileMenu="matMenu">
    <button mat-menu-item routerLink="/register" [queryParams]="{userId:userId}">
      <mat-icon>person</mat-icon>
      Update Profile
    </button>
    <!-- <button mat-menu-item routerLink="/resetpassword">
      <mat-icon>lock</mat-icon>
      Update Password
    </button> -->
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  </mat-menu>

</mat-toolbar>


<mat-drawer-container class="layout-container">

  <!-- SIDEBAR -->
  <mat-drawer #drawer
            class="sidebar"
            mode="over"
            position="start">

  <div class="sidebar-inner">

    <mat-nav-list>

      <a mat-list-item
         routerLink="admin-dashboard"
         routerLinkActive="active-link">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>

      <a mat-list-item
         routerLink="admin-users"
         routerLinkActive="active-link">
        <mat-icon>group</mat-icon>
        <span>Users</span>
      </a>

      <a mat-list-item
         routerLink="assign-technician"
         routerLinkActive="active-link">
        <mat-icon>engineering</mat-icon>
        <span>Assign Technician</span>
      </a>

      <a mat-list-item
         routerLink="product-details"
         routerLinkActive="active-link">
        <mat-icon>inventory_2</mat-icon>
        <span>Products</span>
      </a>

      <a mat-list-item
         routerLink="category-list"
         routerLinkActive="active-link">
        <mat-icon>list</mat-icon>
        <span>Categories</span>
      </a>

    </mat-nav-list>

  </div>

</mat-drawer>


  <!-- CONTENT -->
  <mat-drawer-content class="content-area">
    <router-outlet></router-outlet>
  </mat-drawer-content>

</mat-drawer-container>
