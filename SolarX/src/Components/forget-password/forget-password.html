<div class="send-otp">
  <div class="display-card">
    <mat-card>

      <mat-card-header>
        <h2>Verify Otp</h2>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="sendOtp()">
          <mat-form-field>
            <mat-label>Enter Email</mat-label>
            <input matInput type="email" formControlName="email">
          </mat-form-field>

          <mat-card-actions>
            <button mat-raised-button color="primary" type="submit">
              Send Otp
            </button>
          </mat-card-actions>
        </form>
      </mat-card-content>

    </mat-card>
  </div>
</div>
