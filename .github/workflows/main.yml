name: .NET Build, Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SolarProject.sln

      - name: Build
        run: dotnet build SolarProject.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SolarProject.sln --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish SolarProject/SolarProject.csproj --configuration Release --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: solarx-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
