name: .NET build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SolarProject.sln

      - name: Build
        run: dotnet build SolarProject.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SolarProject.sln --configuration Release --no-build --verbosity normal
